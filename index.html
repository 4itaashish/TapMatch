<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Match Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tap Match Game</h1>
  <p>Grid Size: <span id="grid-size">4x4</span></p>
  <p>Time: <span id="timer">0</span>s | Moves: <span id="moves">0</span> | Missed Attempts: <span id="misses">0</span>/3</p>
  <div id="game-board"></div>
  <p id="message"></p>
  <button id="restart-btn">Restart Game</button>
  <script src="script.js"></script>

  

</body>
</html>
